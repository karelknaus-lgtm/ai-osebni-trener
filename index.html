<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AI osebni trener: načrt vadbe, jedilnik iz slovenskih trgovin, napredek in priprava na fizični test.">
<meta name="theme-color" content="#0B0C0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23C9F23D%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2713%27 text-anchor=%27middle%27 fill=%27%230B0C0A%27%3EAI%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AI osebni trener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column with a bottom tab bar; from 960px a fixed left rail and a centred 880px column */
:root{
  --bg:#0B0C0A; --surface:#151713; --surface-2:#1E211B; --line:#2A2E26; --fg:#F3F5EF; --muted:#8D9488;
  --accent:#C9F23D; --accent-dim:rgba(201,242,61,.14); --ink:#0B0C0A; --warn:#F2B544; --bad:#FF7A66;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --tabbar:72px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-stretch:112%;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px;line-height:1.2;font-weight:700}
p{margin:0}
.num{font-family:var(--display);font-stretch:118%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.acc{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Shell */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-stretch:120%;font-weight:900;font-size:18px;letter-spacing:-.01em}
.logo-mark{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:900;font-stretch:100%}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.view{max-width:880px;margin:0 auto;padding-block:8px calc(var(--tabbar) + 40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

@media (min-width:960px){
  .top{display:none}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:28px;position:fixed;top:0;bottom:0;left:0;width:248px;padding:28px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg);z-index:20}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side .tab{flex-direction:row;justify-content:flex-start;height:46px;padding:0 14px;gap:14px;font-size:14.5px;border-radius:14px;color:var(--muted)}
  .side .tab:hover{background:var(--surface)}
  .side .tab[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
  .side .tab svg{width:21px;height:21px}
  .side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
  .view{margin-left:max(248px, calc(248px + (100vw - 248px - 880px)/2));margin-right:auto;padding-block:36px 64px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
  h1{font-size:38px}
}

/* Cards and controls */
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.tight{padding:16px;gap:12px}
.card.outline{background:transparent;border:1px solid var(--line)}
.card.hero{background:var(--fg);color:var(--ink)}
.card.hero .muted,.card.hero .eyebrow{color:#4E5449}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--fg);border-color:var(--ink)}
.btn.small{height:38px;padding:0 16px;font-size:13.5px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13.5px;font-weight:700;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-dim);color:var(--accent)}
.pill.warn{background:rgba(242,181,68,.14);color:var(--warn)}
.pill.store{background:transparent;border:1px solid var(--line);color:var(--fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.divider{height:1px;background:var(--line)}
input.field,select.field,textarea.field{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;outline:none}
input.field:focus,textarea.field:focus{border-color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-md);border:1px dashed var(--line);font-size:13.5px}

/* Home */
.greet{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line)}
.dot.plan{border:1.5px solid var(--muted)}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:22px}
.stat .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.meal-line:first-child{border-top:0;padding-top:0}
.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.tick svg{width:16px;height:16px}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}

/* Workout */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daybtn{height:64px;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:13px;color:var(--muted)}
.daybtn i{width:6px;height:6px;border-radius:50%;background:transparent}
.daybtn.has i{background:var(--muted)}
.daybtn.done i{background:var(--accent)}
.daybtn.today{color:var(--fg)}
.daybtn[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.daybtn[aria-pressed="true"].has i{background:var(--ink)}
.ex{background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:14px}
.ex-head{display:flex;gap:14px;align-items:center}
.thumb{width:84px;height:68px;border-radius:16px;background:var(--surface-2);flex:none;position:relative;overflow:hidden;display:block}
.thumb svg{width:100%;height:100%}
.thumb .play{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center}
.thumb .play svg{width:10px;height:10px;fill:currentColor;stroke:none}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sets.nokg{grid-template-columns:28px 1fr 44px}
.sets.cardio{grid-template-columns:28px 1fr 44px}
.sets .h{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sets .n{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sets input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-weight:800;font-size:16px;width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.sets input:focus{border-color:var(--accent)}
.sets input:disabled{opacity:.5}
.sets .tick{width:44px;height:44px}
.sets input[data-done]{border-color:transparent;background:var(--accent-dim);color:var(--accent)}
.sets .lbl{font-weight:700;font-size:14px}
.fig line{stroke:var(--fg);stroke-width:6;stroke-linecap:round}
.fig line.back{stroke:var(--muted)}
.fig .head{fill:var(--fg)}
.fig .ground{stroke:var(--line);stroke-width:3}
.fig .prop{stroke:var(--muted);stroke-width:4;stroke-linecap:round;fill:none}
.thumb .fig line{stroke-width:7}

.rest{position:fixed;z-index:35;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabbar) + 10px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--ink);border-radius:22px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.rest .num{font-size:28px;min-width:76px}
.rest .bar{background:#D7DBD0;flex:1}
.rest .bar>i{background:var(--ink)}
.rest .iconbtn{background:#E4E8DD;border-color:transparent;color:var(--ink);font-weight:800;font-size:12.5px;width:42px;height:42px}
.rest.finished{background:var(--accent)}
@media (min-width:960px){.rest{left:auto;right:28px;bottom:28px;width:400px}}

/* Nutrition */
.macro{display:flex;flex-direction:column;gap:6px}
.ing{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.ing .grow{overflow-wrap:anywhere}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.shop-item.checked .grow{color:var(--muted);text-decoration:line-through}
.tablewrap{overflow-x:auto}
table.week-t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.week-t th,.week-t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.week-t th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.week-t td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:40vh}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--fg);color:var(--ink);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg.assistant ul{margin:6px 0;padding-left:18px}
.msg.assistant p+p{margin-top:8px}
.msg.note{align-self:center;background:var(--accent-dim);color:var(--accent);font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px}
.msg.thinking{color:var(--muted)}
.composer{position:sticky;bottom:calc(var(--tabbar) + 8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px;z-index:5}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:40px;max-height:140px;padding:9px 0;font-size:16px;outline:none;line-height:1.4}
.composer .btn{height:42px;width:42px;padding:0}
@media (min-width:960px){.composer{bottom:20px}}

/* Progress */
.chart{width:100%;height:auto;max-height:250px;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart .pt-end{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.chart .endlbl{fill:var(--fg);font-weight:800;font-size:12px}
.chart-empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-md);font-size:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--surface-2);max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.photo[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:6px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:var(--surface-2);max-width:100%}

/* Tests */
.test-pick{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.test-pick{grid-template-columns:1fr 1fr}}
.pick{text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent}
.pick:hover{border-color:var(--line)}
.countdown{display:flex;align-items:flex-end;gap:10px}
.countdown .num{font-size:76px;line-height:.85}
.disc{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.disc:first-child{border-top:0}
.timerbox{background:var(--surface-2);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.timerbox .num{font-size:48px}

/* Profile / subscription */
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0;padding-top:0}
.kv b{font-weight:700;text-align:right}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.plan .num{font-size:24px}
.plan .badge{position:absolute;top:-10px;right:12px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}

/* Onboarding */
.ob{min-height:100%;max-width:560px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-q{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.ob-q h1{font-size:32px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s}
.opt .grow b{display:block;font-size:16.5px;font-weight:800}
.opt .grow span{font-size:13.5px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.opt .tick{width:26px;height:26px}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.bignum{display:flex;align-items:center;justify-content:center;gap:18px;padding:24px 0}
.bignum .num{font-size:84px;line-height:1;min-width:3ch;text-align:center}
.bignum .u{font-size:18px;font-weight:700;color:var(--muted);align-self:flex-end;padding-bottom:12px}
.bignum .iconbtn{width:56px;height:56px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.daygrid button{height:84px;border-radius:20px;background:var(--surface);font-family:var(--display);font-stretch:118%;font-weight:800;font-size:30px;border:1.5px solid transparent}
.daygrid button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px;max-height:86vh}}
.sheet .demo{background:var(--surface-2);border-radius:var(--r-md);height:220px;display:flex;justify-content:center;max-width:100%}
.sheet .demo svg{height:100%;width:auto;max-width:100%}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--ink);font-weight:800;font-size:14px;padding:12px 18px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}

function targets(p = S.profile, w = latestWeight()) {
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === 'z' ? -161 : 5);
  const tdee = bmr * (1.2 + 0.075 * p.days);
  const adj = {hujsanje: -0.2, misice: 0.1, moc: 0.05}[p.goal] || 0;
  const kcal = Math.round(tdee * (1 + adj) / 10) * 10;
  const prot = Math.round(w * (p.goal === 'hujsanje' ? 2.0 : 1.8));
  const fat = Math.round(kcal * 0.27 / 9);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return {kcal, prot, fat, carb, tdee: Math.round(tdee)};
}

function sortedWeights() { return [...S.weights].sort((a, b) => a.d < b.d ? -1 : 1); }

function mealCalc(i) { let k = 0, p = 0, c = 0, f = 0, cost = 0; for (const [id, g] of Object.entries(i)) { const x = PR[id]; k += x.k * g / 100; p += x.p * g / 100; c += x.c * g / 100; f += x.f * g / 100; cost += x.price * g / x.pack; } return {k, p, c, f, cost}; }

  const i = {};

let chartN = 0;
function lineChart(pts, o = {}) {

  const id = 'g' + (++chartN), W = 340, H = o.h || 180, pl = 38, pr = 22, pt = 16, pb = 28, dec = o.dec ?? 1;
  const xs = pts.map(p => parseD(p.d).getTime()), ys = pts.map(p => p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1 - y0) * 0.2 || Math.max(1, y1 * 0.02); y0 -= padY; y1 += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => pl + (t - x0) / (x1 - x0 || 1) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');

    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtN(v, dec)}</text>`).join('')}
    <path d="${area}" fill="url(#${id})"/>

function ensureItem(wdForLog, i, it) {
  const k = dkey(dateOfWd(selDay));
  if (!S.logs[k]) S.logs[k] = {wd: wdForLog, name: plan()[wdForLog]?.name || '', items: {}, done: false};
  const log = S.logs[k];
  if (!log.items[i] || log.items[i].id !== it.id) log.items[i] = {id: it.id, sets: Array.from({length: it.rx.s}, () => ({w: '', r: '', d: false}))};

/* rest timer */
function startRest(sec) { if (!sec) return; rest = {end: Date.now() + sec * 1000, total: sec, finished: false}; clearInterval(restTimer); restTimer = setInterval(tickRest, 250); renderRest(); }
function tickRest() {
  if (!rest) return;
  const left = (rest.end - Date.now()) / 1000;
  if (left <= 0 && !rest.finished) {
    rest.finished = true; beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    setTimeout(() => { if (rest && rest.finished) { rest = null; clearInterval(restTimer); renderRest(); } }, 3500);
  }
  renderRest();
}
function renderRest() {
  const el = $('#rest'); if (!el) return;
  if (!rest) { el.hidden = true; return; }
  const left = Math.max(0, (rest.end - Date.now()) / 1000);
  el.hidden = false; el.classList.toggle('finished', rest.finished);
  el.innerHTML = `${ic('timer')}<span class="num" aria-live="off">${rest.finished ? 'Gremo!' : fmtTime(Math.ceil(left))}</span><div class="bar"><i style="width:${(1 - left / rest.total) * 100}%"></i></div>
    <button class="iconbtn" data-a="rest-adj" data-v="-15" aria-label="15 sekund manj">−15</button><button class="iconbtn" data-a="rest-adj" data-v="15" aria-label="15 sekund več">+15</button><button class="iconbtn" data-a="rest-skip" aria-label="Preskoči odmor">${ic('x')}</button>`;
}
function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.25].forEach(off => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audioCtx.currentTime + off); g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + off + 0.18); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + off); o.stop(audioCtx.currentTime + off + 0.2); });
  } catch (e) {}
}

async function sendChat(text) {
  text = text.trim(); if (!text || chatBusy) return;
  if (sampleState === 'off') return;

  chatBusy = true; render();

  // Context is built once per question so every round of a tool loop sends the same prefix.
  const context = coachContext();
  const execs = Object.fromEntries(coachTools().map(t => [t.name, t.execute]));
  const msgs = S.chat.filter(m => m.role !== 'note').slice(-14).map(m => ({role: m.role, content: m.content}));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  let answer = '';
  const show = () => { const b = $('#chatlog .msg.pending'); if (b) { b.classList.remove('thinking'); b.innerHTML = fmtMsg(answer); b.scrollIntoView({block: 'end'}); } };
  try {
    for (let round = 0; round < 5; round++) {
      const res = await callCoach(context, msgs, ctl.signal);
      const blocks = res.content || [];
      const txt = blocks.filter(b => b.type === 'text').map(b => b.text).join('\n\n').trim();

        try {

        } catch (er) { return {type: 'tool_result', tool_use_id: u.id, content: 'Napaka: ' + er.message, is_error: true}; }
      });
      msgs.push({role: 'user', content: results});
    }
    if (answer) S.chat.push({role: 'assistant', content: answer});
    else if (!chatNote) chatNote = 'Trener ni odgovoril. Pošlji sporočilo znova.';
  } catch (e) {
    if (answer) S.chat.push({role: 'assistant', content: answer});

    else if (e && e.code === 'rate_limited') chatNote = 'Preveč vprašanj naenkrat. Poskusi znova čez nekaj minut.';

}

/* --- sheet --- */

}
function closeSheet() { const o = $('#overlay'); if (o) o.remove(); document.body.style.overflow = ''; clearInterval(testTimer.iv); testTimer = {mode: testTimer.mode, start: 0, acc: 0, run: false, iv: null}; }
function openDemo(id, i) {
  const e = EX[id], c = workoutCtx(selDay), eq = S.profile.equip || 'home', inj = S.profile.injuries || [];

/* ---------- example data ---------- */
function loadExample() {
  S = freshState(); S.example = true; S.onboarded = true;
  S.profile = {goal: 'test', sex: 'm', age: 24, height: 182, weight: 84, exp: 'srednji', equip: 'gym', days: 4, injuries: []};
  const today = new Date(); S.startDate = dkey(addDays(today, -24));
  S.test = {type: 'policija', date: dkey(addDays(today, 52)), targets: {}, mocks: [
    {d: dkey(addDays(today, -20)), r: {t60: 8.9, skok: 212, ovire: 15.2, zgibe: 6, cooper: 712}},
    {d: dkey(addDays(today, -6)), r: {t60: 8.7, skok: 218, ovire: 14.6, zgibe: 8, cooper: 688}}]};
  for (let i = 24; i >= 0; i -= 3) S.weights.push({d: dkey(addDays(today, -i)), kg: Math.round((86.2 - (24 - i) * 0.085 + Math.sin(i) * 0.25) * 10) / 10});
  const base = {pocep_drog: 70, rdl: 70, izpadni_rocke: 14, hip_thrust: 80, bench: 60, ohp: 35, latpull: 50, veslanje_kabel: 50, biceps: 12};
  const P = plan();
  for (let i = 24; i >= 1; i--) {
    const d = addDays(today, -i), wd = dow(d), w = P[wd]; if (!w) continue;
    const wk = Math.floor((24 - i) / 7), items = {};
    w.items.forEach((it, idx) => {
      const e = EX[it.id];
      items[idx] = {id: it.id, sets: Array.from({length: it.rx.s}, (_, s) => ({w: e.w ? String((base[it.id] || 20) + wk * 2.5) : '', r: e.type === 'cardio' ? '' : e.type === 'time' ? '40' : String(e.w ? 10 - (s > 1 ? 1 : 0) : 8 + wk), d: true}))};
    });
    S.logs[dkey(d)] = {wd, name: w.name, items, done: true};
  }
  S.eaten[dkey()] = {zajtrk: true};
  S.nutrition = {enabled: true, meals: ['zajtrk', 'kosilo', 'malica', 'vecerja'], budget: {amount: 150, period: 'mesec'}};
  save();
}

  if (f.id === 'codeform') restoreFromCode($('#code-in').value);
  if (f.id === 'budform' && saveBudget()) { save(); render(); toast(S.nutrition.budget.amount ? 'Jedilnik je prilagojen proračunu' : 'Jedilnik je brez omejitve cene'); }
  if (f.id === 'wform') { const v = Number($('#w-in').value.replace(',', '.')); if (!(v > 30 && v < 300)) { toast('Vpiši težo v kilogramih, npr. 78,5'); return; } const k = dkey(), ex = S.weights.find(w => w.d === k); if (ex) ex.kg = v; else S.weights.push({d: k, kg: v}); S.profile.weight = v; save(); render(); toast('Teža shranjena'); }
  if (f.id === 'mockform') {
    const T = TESTS[S.test.type], r = {}; let any = false;
    for (const dsc of T.d) { const raw = f.elements[dsc.id].value.trim(); if (!raw) continue; const v = dsc.time ? parseTime(raw) : Number(raw.replace(',', '.')); if (v == null || !isFinite(v)) { toast('Preveri vnos: ' + dsc.n); return; } r[dsc.id] = v; any = true; }
    if (!any) { toast('Vpiši vsaj en rezultat'); return; }
    S.test.mocks.push({d: dkey(), r}); save(); closeSheet(); render(); toast('Rezultati poskusnega testa shranjeni');
  }
  if (f.id === 'targetform') {
    const T = TESTS[S.test.type], dsc = T.d.find(x => x.id === f.dataset.id), raw = $('#target-in').value;
    const v = dsc.time ? parseTime(raw) : Number(String(raw).replace(',', '.'));
    if (v == null || !isFinite(v) || v <= 0) { toast('Vpiši veljavno vrednost'); return; }
    S.test.targets[dsc.id] = v; save(); closeSheet(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay')) closeSheet();
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-in') { e.preventDefault(); $('#composer').requestSubmit(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && rest) tickRest(); });

render();
requestAnimationFrame(animLoop);
initRemote();
</script>
